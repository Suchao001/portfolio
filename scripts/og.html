<!doctype html>

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --allow-file-access-from-files \
    --hide-scrollbars --window-size=1200,630 --virtual-time-budget=4000 \
    --screenshot=public/og.png "file://$PWD/scripts/og.html"
-->
<html lang="th">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Plex; font-weight: 400; src: url(../node_modules/@fontsource/ibm-plex-sans-thai/files/ibm-plex-sans-thai-thai-400-normal.woff2); }
  @font-face { font-family: Plex; font-weight: 700; src: url(../node_modules/@fontsource/ibm-plex-sans-thai/files/ibm-plex-sans-thai-thai-700-normal.woff2); }
  @font-face { font-family: PlexL; font-weight: 400; src: url(../node_modules/@fontsource/ibm-plex-sans-thai/files/ibm-plex-sans-thai-latin-400-normal.woff2); }
  @font-face { font-family: PlexL; font-weight: 700; src: url(../node_modules/@fontsource/ibm-plex-sans-thai/files/ibm-plex-sans-thai-latin-700-normal.woff2); }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #030712; color: #fff;
    font-family: PlexL, Plex, sans-serif; display: flex; align-items: center; gap: 64px; padding: 0 80px; position: relative; }
  .glow { position: absolute; inset: -200px auto auto -200px; width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(120,54,207,.45), transparent 65%); }
  .glow2 { position: absolute; right: -150px; bottom: -250px; width: 650px; height: 650px; border-radius: 50%;
    background: radial-gradient(circle, rgba(13,235,216,.25), transparent 65%); }
  .text { position: relative; flex: 1; }
  .chip { display: inline-block; padding: 8px 18px; border-radius: 999px; border: 1px solid rgba(52,211,153,.4);
    background: rgba(52,211,153,.12); color: #6ee7b7; font-size: 22px; margin-bottom: 28px; }
  h1 { font-size: 78px; line-height: 1.1; font-weight: 700; margin-bottom: 12px; }
  .role { font-size: 40px; font-weight: 700; background: linear-gradient(90deg,#a78bfa,#0debd8);
    -webkit-background-clip: text; color: transparent; margin-bottom: 24px; }
  .stack { font-size: 24px; color: #cbd5e1; }
  img { position: relative; width: 340px; height: 340px; object-fit: cover; border-radius: 48px;
    border: 2px solid rgba(255,255,255,.15); transform: rotate(2deg); }
</style>
</head>
<body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="text">
    <div class="chip">เปิดรับงาน · Full-time / Freelance</div>
    <h1>สุเชาว์ หม่อโป๊ะกู่</h1>
    <div class="role">Full-Stack Developer</div>
    <div class="stack">Next.js · TypeScript · PostgreSQL · Docker · Cloudflare</div>
  </div>
  <img src="../public/images/myface1.jpg" alt="" />
</body>
</html>
